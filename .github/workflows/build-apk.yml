name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Если проект залит одним архивом game.zip (удобно с телефона) — распаковываем
      - name: Unpack game.zip (if present)
        run: |
          if [ -f game.zip ]; then unzip -o game.zip; fi
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/MotoStunt.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MotoStunt-apk
          path: out/MotoStunt.apk